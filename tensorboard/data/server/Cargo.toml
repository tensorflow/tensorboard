[package]
name = "rustboard"
version = "0.8.0-alpha.0"
authors = ["The TensorFlow Authors <tensorboard-gardener@google.com>"]
# Keep in sync with `edition` in rustfmt.toml.
edition = "2018"
default-run = "rustboard"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
async-stream = "0.3.0"
async-trait = "0.1.41"
base64 = "0.13.0"
byteorder = "1.3.4"
bytes = "1.0.1"
clap = "3.0.0-beta.2"
crc = "1.8.1"
crossbeam = "0.8.0"
env_logger = "0.8.2"
futures-core = "0.3.12"
gcp_auth = "0.7.4"
log = "0.4.11"
prost = "0.9.0"
prost-types = "0.9.0"
rand = "0.7.3"
rand_chacha = "0.2.2"
rayon = "1.5.0"
reqwest = { version = "0.11.0", features = ["blocking", "json", "rustls-tls"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.59"
thiserror = "1.0.21"
tokio = { version = "1.8.4", features = ["macros", "rt-multi-thread", "parking_lot"] }
tokio-stream = { version = "0.1.2", features = ["net"] }
tonic = "0.6.2"
tonic-reflection = "0.3.0"
walkdir = "2.3.1"

[dev-dependencies]
prost-build = "0.9.0"
tempfile = "3.1.0"
tonic-build = "0.6.2"

[[bin]]
name = "rustboard"
path = "main.rs"

[[bin]]
name = "bench"
path = "bench.rs"

[[bin]]
name = "gsutil"
path = "gcs/gsutil.rs"

[lib]
name = "rustboard_core"
path = "lib.rs"

[profile.release]
strip = true
