name: nightly-release

on:
  schedule:
    # 11:00 UTC is 03:00 in Pacific standard time (UTC-8), which is well
    # after nightly TensorFlow wheels are released (around 1--2 AM).
    # (cron syntax: minute hour day-of-month month day-of-week)
    - cron: '0 11 * * *'

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  nightly-release:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    needs: ci
    if: github.repository == 'tensorflow/tensorboard'
    steps:
      - name: Download pip package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: tb-nightly_py*
          # Download all matching artifacts in the same directory (specified by path)
          merge-multiple: true
          path: wheels
      - name: Install and check Twine
        working-directory: wheels
        run: |
          pip install twine
          twine check tb_nightly*.whl
      - name: Authenticate to Google Cloud (OSS Exit Gate)
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: 'projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github'
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1
      - name: Clean up stale releases from staging repo
        run: |
          packages=$(gcloud artifacts packages list \
              --project="oss-exit-gate-prod" \
              --location="us" \
              --repository="tensorboard--pypi" \
              --format="value(name)" 2>/dev/null)
          echo "${packages}" | xargs -r -I {} sh -c '
              package_name=$(basename "{}")
              echo "Deleting package: $package_name..."
              gcloud artifacts packages delete "{}" \
                  --project="oss-exit-gate-prod" \
                  --location="us" \
                  --repository="tensorboard--pypi" \
                  --quiet
          '
      - name: Stage distributions to OSS Exit Gate and upload manifest
        working-directory: wheels
        run: |
          python -m pip install --upgrade twine
          python -m twine upload \
            --repository-url "https://us-python.pkg.dev/oss-exit-gate-prod/tensorboard--pypi/" \
            -u oauth2accesstoken \
            -p "$(gcloud auth print-access-token)" \
            tb_nightly*.whl
          echo '{"publish_all": true}' > manifest.json
          gcloud storage cp manifest.json \
            "gs://oss-exit-gate-prod-projects-bucket/tensorboard/pypi/manifests/manifest-${{ github.run_id }}-${{ github.run_attempt }}.json"
